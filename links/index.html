<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kewa — Asal Dianat · Links</title>
<meta name="description" content="Kewa — Asal Dianat, styling & couture. Book, browse the collection, get in touch.">
<meta name="theme-color" content="#1B1517">
<meta property="og:title" content="Kewa — Asal Dianat · Styling &amp; Couture">
<meta property="og:description" content="Book a styling appointment, commission a couture piece, browse the collection.">

<style>
  /* deliberately single-theme: an evening, editorial look */
  :root {
    --ground: #1B1517;
    --ink: #F0E9E4;
    --ink-soft: #B4A7A1;
    --line: #453A3D;
    --accent: #A63946;
    --display: "Didot", "Bodoni MT", "Bodoni 72", "Playfair Display", Georgia, serif;
    --body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  body {
    margin: 0;
    min-height: 100dvh;
    background:
      radial-gradient(120% 70% at 50% 0%, #2A1E21 0%, var(--ground) 60%);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 430px;
    padding: 56px 24px calc(40px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .avatar {
    width: 108px; height: 108px;
    border-radius: 999px;
    object-fit: cover;
    border: 2px solid var(--accent);
    padding: 3px;
    background: var(--ground);
  }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 40px;
    letter-spacing: 0.04em;
    margin: 18px 0 4px;
  }
  h1 .dot { color: var(--accent); font-style: italic; }
  .tag {
    margin: 0 0 6px;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .bio {
    margin: 0 0 30px;
    max-width: 34ch;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .links {
    width: 100%;
    display: flex; flex-direction: column; gap: 12px;
  }
  .link {
    display: flex; align-items: center; justify-content: center;
    min-height: 54px;
    padding: 14px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    text-decoration: none;
    color: var(--ink);
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .link:hover { border-color: var(--ink); transform: translateY(-1px); }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .link.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #FAF7F3;
  }
  .link.primary:hover { background: #B84350; }
  footer {
    margin-top: 36px;
    font-size: 11px; letter-spacing: 0.12em;
    color: var(--ink-soft);
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<main class="card">
  <img class="avatar" src="../photos/web/avatar.jpg" alt="Asal Dianat">
  <h1>Kewa<span class="dot">.</span></h1>
  <p class="tag">Asal Dianat · Styling &amp; Couture</p>
  <p class="bio">Styling appointments, couture commissions, and ready-to-wear made to order. London.</p>

  <nav class="links" aria-label="Links">
    <a class="link primary" href="https://wa.me/447448983893?text=Hi%20Asal%2C%20I%27d%20like%20to%20book%20a%20styling%20appointment." target="_blank" rel="noopener">Book a styling appointment</a>
    <a class="link" href="../#work">View the collection</a>
    <a class="link" href="https://wa.me/447448983893?text=Hi%20Asal%2C%20I%27d%20like%20to%20commission%20a%20couture%20piece." target="_blank" rel="noopener">Commission a couture piece</a>
    <a class="link" href="../">Visit the website</a>
    <a class="link" href="https://wa.me/447448983893" target="_blank" rel="noopener">WhatsApp</a>
    <a class="link" href="https://instagram.com/kewa_design" target="_blank" rel="noopener">Instagram @kewa_design</a>
  </nav>

  <footer>© 2026 Kewa — <a href="../">msheikhattari.github.io/kewa-design</a></footer>
</main>
</body>
</html>
